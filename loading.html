<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DSH 桌面版</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, #0f1220 55%, #0a0c16 100%);
    color: #e8ecf4;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .box { text-align: center; max-width: 480px; padding: 24px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px;
    background: linear-gradient(135deg, #4cc2ff, #2f6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff;
    box-shadow: 0 8px 30px rgba(76, 194, 255, .35);
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #9aa5bd; line-height: 1.7; }
  .spinner {
    width: 34px; height: 34px; margin: 26px auto 10px;
    border: 3px solid rgba(76, 194, 255, .2); border-top-color: #4cc2ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12px; color: #6b7690; margin-top: 14px; }
  code { background: #1a2138; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">D</div>
    <h1>DSH 桌面版</h1>
    <div class="sub" id="text">正在启动 DeepSeek Harness…</div>
    <div class="spinner"></div>
    <div class="hint">首次启动可能需要几分钟（安装插件）。<br>如长时间无响应，关闭窗口后重试，详见日志。</div>
  </div>
  <script>
    try {
      const q = new URLSearchParams(location.search);
      const t = q.get('text');
      if (t) document.getElementById('text').textContent = decodeURIComponent(t);
    } catch (e) {}
  </script>
</body>
</html>

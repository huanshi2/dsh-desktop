<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DSH Desktop</title>
<style>
  :root {
    color-scheme: dark;
    --tb-bg1: #131a30;
    --tb-bg2: #0f1220;
    --tb-border: rgba(76, 194, 255, .18);
    --tb-fg: #e8ecf4;
    --tb-ver: #6fa8dc;
    --tb-btn: #c7d0e2;
    --tb-hover: rgba(255, 255, 255, .12);
    --tb-active: rgba(255, 255, 255, .18);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --tb-bg1: #f7f9fc;
      --tb-bg2: #eef1f7;
      --tb-border: rgba(37, 99, 235, .20);
      --tb-fg: #1a2030;
      --tb-ver: #2563eb;
      --tb-btn: #3a4256;
      --tb-hover: rgba(0, 0, 0, .08);
      --tb-active: rgba(0, 0, 0, .14);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* html 高度 36px + overflow hidden 防滚动条；body 必须 overflow visible，否则下拉菜单被裁剪 */
  html { width: 100%; height: 36px; overflow: hidden; }
  body {
    width: 100%;
    min-height: 36px;
    overflow: visible;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--tb-bg1) 0%, var(--tb-bg2) 100%);
    color: var(--tb-fg);
    user-select: none;
    border-bottom: 1px solid var(--tb-border);
  }
  #bar {
    display: flex; align-items: center;
    height: 36px;
    padding: 0 148px 0 12px; /* 右侧预留系统窗口按钮区（最小化/最大化/关闭） */
    -webkit-app-region: drag; /* 可拖拽移动窗口 */
  }
  .logo {
    width: 18px; height: 18px; margin-right: 8px;
    border-radius: 5px;
    background: linear-gradient(135deg, #4cc2ff, #2f6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    flex: none;
  }
  #title {
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #title .ver { color: var(--tb-ver); font-weight: 400; margin-left: 6px; font-size: 11px; }
  .spacer { flex: 1; }
  /* "?"帮助按钮：位于最小化按钮左侧（系统按钮区占右侧 ~148px） */
  #btn-help {
    -webkit-app-region: no-drag;
    width: 36px; height: 26px;
    margin-right: 2px;
    border: 1px solid var(--tb-border);
    border-radius: 6px;
    background: transparent;
    color: var(--tb-btn);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  #btn-help:hover { background: var(--tb-hover); color: var(--tb-fg); }
  #btn-help:active { background: var(--tb-active); }
</style>
</head>
<body>
  <div id="bar">
    <div class="logo">D</div>
    <div id="title">DSH Desktop<span class="ver" id="ver"></span></div>
    <div class="spacer"></div>
    <button id="btn-help" title="帮助（检查更新 / 关于）">?</button>
  </div>

  <script>
    const tb = window.titlebarBridge;
    const btn = document.getElementById('btn-help');

    if (tb) {
      tb.getVersion().then(v => {
        document.getElementById('ver').textContent = v ? 'v' + v : '';
      }).catch(() => {});

      // 注意：菜单不能放在 titlebar 的 DOM 里（会被其下的 WebContentsView 遮挡），
      // 统一由主进程弹出独立菜单窗口（helpmenu.html），这里只转发点击。
      btn.addEventListener('click', () => tb.helpToggle());

      // 点击标题栏其他区域 / 按 Esc → 关闭菜单
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#btn-help')) tb.helpClose();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') tb.helpClose();
      });
    }
  </script>
</body>
</html>

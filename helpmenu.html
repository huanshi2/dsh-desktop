<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DSH Desktop 帮助菜单</title>
<style>
  :root {
    color-scheme: dark;
    --menu-bg: #151c33;
    --menu-border: rgba(76, 194, 255, .25);
    --menu-shadow: rgba(0, 0, 0, .55);
    --menu-fg: #e8ecf4;
    --menu-item-hover: rgba(76, 194, 255, .16);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --menu-bg: #ffffff;
      --menu-border: rgba(37, 99, 235, .22);
      --menu-shadow: rgba(0, 0, 0, .18);
      --menu-fg: #1a2030;
      --menu-item-hover: rgba(37, 99, 235, .10);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #menu {
    width: 100%;
    height: 100%;
    padding: 4px;
    background: var(--menu-bg);
    border: 1px solid var(--menu-border);
    border-radius: 8px;
    box-shadow: 0 8px 24px var(--menu-shadow);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12px;
    user-select: none;
  }
  #menu .item {
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
    color: var(--menu-fg);
    white-space: nowrap;
    transition: background .1s;
  }
  #menu .item:hover { background: var(--menu-item-hover); }
</style>
</head>
<body>
  <div id="menu">
    <div class="item" data-action="check-dsh-update">检查并更新 DSH</div>
    <div class="item" data-action="check-app-update">检查桌面版更新</div>
    <div class="item" data-action="about">关于 DSH Desktop</div>
  </div>
  <script>
    const bridge = window.helpMenuBridge;
    if (bridge) {
      document.querySelectorAll('.item').forEach((item) => {
        item.addEventListener('click', () => bridge.menuAction(item.dataset.action));
      });
    }
  </script>
</body>
</html>

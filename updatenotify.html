<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DSH 更新提示</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #151c33;
    --border: rgba(76, 194, 255, .32);
    --shadow: rgba(0, 0, 0, .55);
    --fg: #e8ecf4;
    --sub: #9aa5bd;
    --accent: #4cc2ff;
    --btn-hover: rgba(76, 194, 255, .16);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --border: rgba(37, 99, 235, .28);
      --shadow: rgba(0, 0, 0, .20);
      --fg: #1a2030;
      --sub: #5b6478;
      --accent: #2563eb;
      --btn-hover: rgba(37, 99, 235, .10);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #card {
    width: 100%; height: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 28px var(--shadow);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12px;
    color: var(--fg);
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  #msg { font-weight: 600; margin-bottom: 4px; }
  #detail { font-size: 11px; color: var(--sub); line-height: 1.6; margin-bottom: 10px; flex: 1; }
  #btns { display: flex; gap: 8px; }
  #btns button {
    flex: 1;
    padding: 5px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-size: 12px;
    cursor: pointer;
    transition: background .12s;
  }
  #btns button:hover { background: var(--btn-hover); }
  #btns .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #btns .primary:hover { opacity: .88; }
</style>
</head>
<body>
  <div id="card">
    <div id="msg">发现 DSH 新版本</div>
    <div id="detail"></div>
    <div id="btns">
      <button id="btn-update" class="primary">立即更新</button>
      <button id="btn-ignore">忽略此版本</button>
    </div>
  </div>
  <script>
    const bridge = window.updateNotifyBridge;
    if (bridge) {
      const q = new URLSearchParams(location.search);
      const cur = q.get('cur');
      const latest = q.get('latest');
      const kind = q.get('kind') || 'dsh';
      if (kind === 'app') {
        document.getElementById('msg').textContent = '发现桌面版新版本';
        document.getElementById('detail').innerHTML =
          `当前 v${cur} → 最新 v${latest}<br>点击更新将下载新版并自动替换，完成后重启。`;
      } else {
        document.getElementById('detail').innerHTML =
          `当前 v${cur} → 最新 v${latest}<br>点击更新在 App 内升级，不影响当前使用。`;
      }
      document.getElementById('btn-update').addEventListener('click', () => bridge.action('update'));
      document.getElementById('btn-ignore').addEventListener('click', () => bridge.action('ignore'));
    }
  </script>
</body>
</html>
